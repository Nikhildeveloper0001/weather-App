<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">


        <div class="card">

            <div class="search">
                <input type="text" placeholder="Enter your city..." spellcheck="false">
                <button><img src="attachments/search.png"></button>
            </div>
            <div class="error">
                <p>Invalid City Name</p>
            </div>
            <div class="loader">
                <!-- Loading feature -->
            </div>


            <div class="weather">
                <img src="attachments/rain.png" class="weather-icon">
                <h1 class="temp"></h1>
                <h2 class="city"></h2>
                <div class="details">
                    <div class="col">
                        <img src="attachments/humidity.png">
                        <div>
                            <p class="humidity"></p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="col">
                        <img src="attachments/wind.png">
                        <div>
                            <p class="wind"></p>
                            <p>Wind speed</p>
                        </div>
                    </div>
                </div>
            </div>


        </div>

        <script src="script.js"></script>

    </div>

</body>

</html>
